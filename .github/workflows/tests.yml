# Fleet app tests: every direct push to version-15, every PR, and nightly.
# Mechanics live in bvisible/neoffice-ci (public: reusable workflows must be public for public callers):
# bench init on OUR frappe fork, deps, blocking build, run-tests, report to the
# hub which opens/closes the repo's [CI] issue in bvisible/neoffice-maintenance.
name: Tests
on:
  push:
    branches: [version-15]
  pull_request:
  workflow_dispatch:
    inputs:
      test_args:
        description: "Extra args for bench run-tests (e.g. --debug-records)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * *"
concurrency:
  group: tests-${{ github.ref }}
  # A push to version-15 no longer cuts the run before it: with several pushes within minutes of a long
  # run, every run was cancelled before its end and none gave a verdict. A run still waiting gives way
  # to a newer one, so one runs and one waits at most; the runs of a pull request still cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: telephony
      install_apps: "erpnext"
      test_args: ${{ inputs.test_args || '' }}
    # inherit: CI_REPORT_SECRET + FLEET_READ_TOKEN (private bvisible deps)
    secrets: inherit