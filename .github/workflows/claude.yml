# @claude on issues, PRs and comments of this app repo. Interactive mode: a
# collaborator mentions @claude and it analyzes, implements on a branch and
# opens a PR (agents never push to version-15 — fleet rule). Uses the owner's
# Claude subscription (CLAUDE_CODE_OAUTH_TOKEN, official setup-token flow).
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
jobs:
  claude:
    if: contains(github.event.comment.body || github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"