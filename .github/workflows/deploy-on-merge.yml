# Merge on version-15 = deploy tonight. The merge is the HUMAN act of the
# automation loop (agents only open PRs); this workflow tells the hub, which
# merge-appends the app into the Nightly Deploy queue and comments the tracker
# issue when the branch names one (agent/issue-N). Direct pushes to version-15
# deploy through the same nightly queue but are queued by hand — this hook
# only fires for merged PRs, where the merge click is the explicit decision.
name: Deploy on merge
on:
  pull_request:
    types: [closed]
    branches: [version-15]
permissions:
  contents: read
jobs:
  queue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every value reaches the shell as an environment variable, never pasted into the script: a branch name is
      # chosen by whoever opens the PR, and one holding `"` and `$(...)` would run in the step that holds the secret.
      - name: Queue the app for tonight's nightly deploy
        env:
          SECRET: ${{ secrets.CI_REPORT_SECRET }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          curl -sS --max-time 20 -X POST \
            "https://neoservice.neoffice.me/api/method/neoffice_devops.github.deploy_hook.pr_merged" \
            --data-urlencode "secret=${SECRET}" \
            --data-urlencode "repo=${REPO}" \
            --data-urlencode "app=telephony" \
            --data-urlencode "pr=${PR}" \
            --data-urlencode "head_ref=${HEAD_REF}" \
            --data-urlencode "base_ref=${BASE_REF}"